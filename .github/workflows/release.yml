name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v1.17.6"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release (iOS16/17)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      THEOS: /Users/runner/work/_theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg make

      - name: Pin Xcode 16.2
        run: |
          # iOS 18.4+ SDK 的 c_standard_library.modulemap 带
          # found_incompatible_headers__check_search_paths 守卫，会让
          # theos 的 17.0 overlay 在 -fmodules 下编译失败；且 theos 的
          # Darwin.mk 会把 DEVELOPER_DIR 重置为 xcode-select 路径，
          # 所以这里必须用 xcode-select 钉到 16.2（iPhoneOS18.2.sdk，无守卫）。
          sudo xcode-select -s /Applications/Xcode_16.2.0.app
          xcodebuild -version

      - name: Set up Theos (roothide fork)
        run: |
          # --recursive 拉齐 vendor 子模块：vendor/lib = roothide/lib（含
          # libroot.a，jbroot() 静态链接依赖）。
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          test -f "$THEOS/vendor/lib/libroot.a"

      - name: Prepare SDKs
        run: |
          # iPhoneOS16.5：theos/sdks 提供（含私有框架 tbd）。
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          # iPhoneOS17.0：theos/sdks 未收录；用 runner Xcode 的 iOS SDK 组装
          # overlay（公开框架 / usr 链接；部署线 14.0）。本项目链接的私有框架
          # （IOKit / BackBoardServices / GraphicsServices）全部走仓库 tbd/ 存根
          # 按路径链接，不依赖 SDK 内 PrivateFrameworks，无需额外 stub。
          XCODE_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p "$THEOS/sdks/iPhoneOS17.0.sdk/System/Library/PrivateFrameworks"
          ln -s "$XCODE_SDK/System/Library/Frameworks" "$THEOS/sdks/iPhoneOS17.0.sdk/System/Library/Frameworks"
          ln -s "$XCODE_SDK/usr" "$THEOS/sdks/iPhoneOS17.0.sdk/usr"
          ln -s "$XCODE_SDK/SDKSettings.plist" "$THEOS/sdks/iPhoneOS17.0.sdk/SDKSettings.plist"
          echo "Xcode iPhoneOS SDK: $XCODE_SDK"

      - name: Verify release tag matches control version
        run: |
          set -euo pipefail
          CONTROL_VERSION="$(awk -F': ' '/^Version:/{print $2; exit}' control)"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$CONTROL_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match control Version ($CONTROL_VERSION)." >&2
            exit 1
          fi
          plutil -extract CFBundleShortVersionString raw -o - ChargeLimiter/Info.plist | grep -qx "$TAG_VERSION"

      - name: Build packages (both targets)
        run: ./build.sh

      - name: Verify expected release assets
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          test -f "out/ChargeLimiter_${TAG_VERSION}_roothide_ios16_arm64e.deb"
          test -f "out/ChargeLimiter_${TAG_VERSION}_roothide_ios17_arm64e.deb"
          ls -l out/ChargeLimiter_*

      - name: Generate release notes
        run: |
          mkdir -p out
          ./scripts/generate_release_notes.py \
            --current-tag "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" \
            --output out/release-notes.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file out/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file out/release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            out/ChargeLimiter_* \
            --clobber
