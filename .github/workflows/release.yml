name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v1.17.5"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install packaging tools
        run: brew install dpkg ldid

      # Theos roothide 工程：双 SDK（iPhoneOS16.5 / 17.0）来自 theos/sdks，
      # jbroot() 静态库 libroot.a 来自 roothide/theos 的 vendor。
      - name: Prepare Theos (roothide)
        run: |
          set -euo pipefail
          THEOS_DIR="$RUNNER_TEMP/theos-roothide"
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$THEOS_DIR"
          if [ ! -d "$THEOS_DIR/sdks/iPhoneOS16.5.sdk" ] || [ ! -d "$THEOS_DIR/sdks/iPhoneOS17.0.sdk" ]; then
            rm -rf "$THEOS_DIR/sdks"
            git clone --depth 1 https://github.com/theos/sdks.git "$THEOS_DIR/sdks"
          fi
          test -d "$THEOS_DIR/sdks/iPhoneOS16.5.sdk"
          test -d "$THEOS_DIR/sdks/iPhoneOS17.0.sdk"
          test -f "$THEOS_DIR/vendor/include/IOKit/hid/IOHIDService.h"
          test -f "$THEOS_DIR/vendor/include/MobileCoreServices/LSApplicationProxy.h"
          test -f "$THEOS_DIR/vendor/lib/libroot.a" || {
            echo "[ERR] libroot.a missing from roothide theos vendor (jbroot() static link)" >&2
            exit 1
          }
          echo "THEOS=$THEOS_DIR" >> "$GITHUB_ENV"

      - name: Verify release tag matches control version
        run: |
          set -euo pipefail
          CONTROL_VERSION="$(awk -F': ' '/^Version:/{print $2; exit}' control)"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$CONTROL_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match control Version ($CONTROL_VERSION)." >&2
            exit 1
          fi
          plutil -extract CFBundleShortVersionString raw -o - ChargeLimiter/Info.plist | grep -qx "$TAG_VERSION"

      - name: Build packages
        run: ./build.sh

      - name: Verify expected release assets
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          test -f "out/ChargeLimiter_${TAG_VERSION}_roothide_ios16_arm64e.deb"
          test -f "out/ChargeLimiter_${TAG_VERSION}_roothide_ios17_arm64e.deb"
          ls -l out/ChargeLimiter_*

      - name: Generate release notes
        run: |
          mkdir -p out
          ./scripts/generate_release_notes.py \
            --current-tag "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" \
            --output out/release-notes.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file out/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file out/release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            out/ChargeLimiter_* \
            --clobber
